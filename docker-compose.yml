# Ghostwire Analytics: app + PostgreSQL.
# Dev: `docker compose up -d db`, then `npm run dev`.
# Full stack: `docker compose up -d --build`.
services:
  app:
    build: .
    image: ghostwire-analytics:latest
    ports:
      - "8770:3000"
    environment:
      DATABASE_URL: postgresql://ghostwire:${POSTGRES_PASSWORD:-ghostwire}@db:5432/ghostwire_analytics
      # Required. Generate with: npx auth secret
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8770}
      # The app's own logs: JSON lines on stdout and daily files in the app-logs volume.
      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-30}
      # Optional: delete raw replay/heatmap/error data older than N days (unset = keep all).
      DATA_RETENTION_DAYS: ${DATA_RETENTION_DAYS:-}
      REPLAY_RETENTION_DAYS: ${REPLAY_RETENTION_DAYS:-}
      HEATMAP_RETENTION_DAYS: ${HEATMAP_RETENTION_DAYS:-}
      ERROR_RETENTION_DAYS: ${ERROR_RETENTION_DAYS:-}
      # Optional: email alerts and reports.
      SMTP_URL: ${SMTP_URL:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: ${APP_URL:-}
      # Optional: single sign-on (OpenID Connect).
      OIDC_DISCOVERY_URL: ${OIDC_DISCOVERY_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_NAME: ${OIDC_NAME:-}
      OIDC_AUTO_CREATE: ${OIDC_AUTO_CREATE:-}
      # Set to postgres when running more than one app container.
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-}
    volumes:
      - app-logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "5"
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Opt-in daily backups: `docker compose --profile backup up -d`.
  # Writes ./backups/ghostwire-<date>.dump (pg_dump custom format), keeps BACKUP_KEEP_DAYS.
  backup:
    image: postgres:17-alpine
    profiles: ["backup"]
    environment:
      PGHOST: db
      PGDATABASE: ghostwire_analytics
      PGUSER: ghostwire
      PGPASSWORD: ${POSTGRES_PASSWORD:-ghostwire}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          file=/backups/ghostwire-$$(date +%Y%m%d-%H%M).dump
          if pg_dump -Fc -f "$$file.tmp"; then
            mv "$$file.tmp" "$$file" && echo "Backup written: $$file"
            find /backups -name 'ghostwire-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          else
            rm -f "$$file.tmp"; echo "Backup failed" >&2
          fi
          sleep 86400
        done
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ghostwire_analytics
      POSTGRES_USER: ghostwire
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghostwire}
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  app-logs:
