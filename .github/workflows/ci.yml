name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      # Tests mock the database; Prisma only needs a URL to generate its client.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v5
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prisma generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:tracker && pnpm build:recorder

  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [react, node]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: packages/${{ matrix.package }}/package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: pnpm
          cache-dependency-path: packages/${{ matrix.package }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm build

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.15']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
        working-directory: packages/python

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t ghostwire-analytics:ci .

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Shell syntax
        run: for f in $(git ls-files '*.sh'); do bash -n "$f" || exit 1; done

  # ─────────────────────────────────────────────
  # Release: when VERSION changes on main and everything above passes, tag v<VERSION> and
  # publish a GitHub release with notes. The same job in every Ghostwire app.
  # ─────────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [app, packages, python, docker, scripts]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Release if VERSION changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet HEAD~1 -- VERSION; then echo "VERSION unchanged"; exit 0; fi
          TAG="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$TAG" > /dev/null 2>&1; then echo "$TAG is already released"; exit 0; fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Ghostwire Analytics $TAG" --generate-notes
