name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      # Tests mock the database; Prisma only needs a URL to generate its client.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # npm install rather than npm ci: see AGENTS.md (lockfiles from npm < 11.19).
      - run: npm install --no-audit --no-fund
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:tracker && npm run build:recorder

  packages:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [react, node]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests
        working-directory: packages/python

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ghostwire-analytics:ci .
