[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostwire-analytics"
version = "0.1.0"
description = "Error reporting for Ghostwire Analytics: exceptions, crashes, ASGI/WSGI apps and logging."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []
keywords = ["error-reporting", "analytics", "ghostwire", "fastapi", "flask", "django"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Framework :: FastAPI",
  "Framework :: Flask",
  "Framework :: Django",
]

[project.urls]
Homepage = "https://github.com/garethcheyne/ghostwire-analytics"
Source = "https://github.com/garethcheyne/ghostwire-analytics/tree/master/packages/python"

[tool.setuptools.packages.find]
where = ["src"]
